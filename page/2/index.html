<script>
  // Dark Mode Logic
  (function() {
    var toggle = document.querySelector('.dark-mode-toggle');
    var icon = toggle.querySelector('i');

    function updateIcon(isDark) {
      if (isDark) {
        icon.className = 'fas fa-sun';
        toggle.title = "Switch to Light Mode";
      } else {
        icon.className = 'fas fa-moon';
        toggle.title = "Switch to Dark Mode";
      }
    }

    var isDark = document.documentElement.classList.contains('dark-mode');
    updateIcon(isDark);

    toggle.addEventListener('click', function() {
      var isDark = document.documentElement.classList.contains('dark-mode');
      if (isDark) {
        document.documentElement.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
        updateIcon(false);
      } else {
        document.documentElement.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
        updateIcon(true);
      }
    });
  })();

  // Back to Top Logic
  (function() {
    var backToTop = document.querySelector('.custom-back-to-top');
    var circle = document.querySelector('.progress-ring__circle');
    var radius = circle.r.baseVal.value;
    var circumference = radius * 2 * Math.PI;

    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = circumference;

    function setProgress(percent) {
      const offset = circumference - percent / 100 * circumference;
      circle.style.strokeDashoffset = offset;
    }

    window.addEventListener('scroll', function() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var scrollPercent = (scrollTop / docHeight) * 100;

      // Show/Hide button
      if (scrollTop > 100) {
        backToTop.classList.add('show');
      } else {
        backToTop.classList.remove('show');
      }

      // Update progress ring
      setProgress(scrollPercent);
    });

    backToTop.addEventListener('click', function() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  })();

  // Custom TOC Logic
  (function() {
    var tocContainer = document.querySelector('.custom-toc-container');
    var tocList = document.querySelector('.custom-toc-list');
    var postBody = document.querySelector('.post-body'); // NexT's content container
    var tocHeader = document.querySelector('.custom-toc-header');
    var minimizedIcon = document.querySelector('.custom-toc-minimized-icon');
    var expandAllBtn = document.querySelector('.custom-toc-expand-all');

    if (!tocContainer || !tocList || !postBody || !tocHeader || !minimizedIcon || !expandAllBtn) return;

    var state = window.__custom_toc_state || (window.__custom_toc_state = {});

    function hasProtectedBlocks() {
      return !!document.querySelector('.protected-block[data-protected]');
    }

    function isLoggedIn() {
      return !!(window.SiteAuth && window.SiteAuth.isLoggedIn && window.SiteAuth.isLoggedIn());
    }

    function canShowTOC() {
      if (!hasProtectedBlocks()) return true;
      return isLoggedIn();
    }

    function hideTOC() {
      tocContainer.classList.remove('show');
      tocList.innerHTML = '';
    }

    function restoreState() {
      var isCollapsed = localStorage.getItem('toc-collapsed') === 'true';
      if (isCollapsed) {
        tocContainer.classList.add('collapsed');
        tocContainer.title = "Expand TOC";
      } else {
        tocContainer.classList.remove('collapsed');
        tocContainer.title = "Collapse TOC";
      }
    }

    function buildTOC() {
      restoreState();

      if (!canShowTOC()) {
        hideTOC();
        return;
      }

      var headings = postBody.querySelectorAll('h1, h2, h3, h4, h5, h6');
      if (!headings.length) {
        hideTOC();
        return;
      }

      tocList.innerHTML = '';
      tocContainer.classList.add('show');

      var stack = [{ ul: tocList, level: 0 }];
      headings.forEach(function(heading, index) {
        var id = heading.id || 'heading-' + index;
        heading.id = id;

        var level = parseInt(heading.tagName.charAt(1));

        var li = document.createElement('li');
        li.className = 'custom-toc-item level-' + level;

        var div = document.createElement('div');
        div.className = 'toc-item-content';

        var arrow = document.createElement('i');
        arrow.className = 'fas fa-chevron-right toc-arrow';

        arrow.addEventListener('click', function(e) {
          e.stopPropagation();
          li.classList.toggle('expanded');
        });

        var a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = heading.textContent;

        a.addEventListener('click', function(e) {
          e.preventDefault();
          document.querySelector('#' + id).scrollIntoView({
            behavior: 'smooth'
          });
          history.pushState(null, null, '#' + id);
        });

        div.appendChild(arrow);
        div.appendChild(a);
        li.appendChild(div);

        while (stack.length > 1 && stack[stack.length - 1].level >= level) {
          stack.pop();
        }

        if (level > stack[stack.length - 1].level && level !== 1) {
          var parentUl = stack[stack.length - 1].ul;
          var lastLiForNest = parentUl.lastElementChild;
          if (lastLiForNest) {
            var wrapper = document.createElement('div');
            wrapper.className = 'toc-child-wrapper';
            var inner = document.createElement('div');
            inner.className = 'toc-child-inner';
            var childUl = document.createElement('ul');
            inner.appendChild(childUl);
            wrapper.appendChild(inner);
            lastLiForNest.appendChild(wrapper);

            var pArrow = lastLiForNest.querySelector('.toc-arrow');
            if (pArrow) pArrow.style.visibility = 'visible';

            var parentLevelMatch2 = lastLiForNest.className.match(/level-(\d)/);
            var parentLvl = parentLevelMatch2 ? parseInt(parentLevelMatch2[1]) : 0;
            if (parentLvl <= 1) lastLiForNest.classList.add('expanded');

            stack.push({ ul: childUl, level: level });
          }
        }

        stack[stack.length - 1].ul.appendChild(li);
      });

      state.headings = headings;
      state.tocLinks = tocList.querySelectorAll('a');
      state.scrollSpy = function() {
        if (!state.headings || !state.tocLinks) return;
        var fromTop = window.scrollY + 100;
        var currentHeading = null;

        state.headings.forEach(function(heading) {
          if (heading.offsetTop <= fromTop) currentHeading = heading;
        });

        if (!currentHeading) return;
        var id = currentHeading.id;

        state.tocLinks.forEach(function(link) {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + id) {
            link.classList.add('active');

            var parentItem = link.closest('.custom-toc-item');
            while (parentItem) {
              parentItem.classList.add('expanded');
              parentItem = parentItem.parentElement.closest('.custom-toc-item');
            }

            var linkRect = link.getBoundingClientRect();
            var containerRect = tocContainer.getBoundingClientRect();
            if (linkRect.top < containerRect.top || linkRect.bottom > containerRect.bottom) {
              link.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
          }
        });
      };

      state.scrollSpy();
    }

    if (!state.bound) {
      state.bound = true;

      tocHeader.addEventListener('click', function(e) {
        if (e.target.closest('.custom-toc-expand-all')) return;
        e.stopPropagation();
        tocContainer.classList.toggle('collapsed');
        var collapsed = tocContainer.classList.contains('collapsed');
        localStorage.setItem('toc-collapsed', collapsed);
        tocContainer.title = collapsed ? "Expand TOC" : "Collapse TOC";
      });

      minimizedIcon.addEventListener('click', function(e) {
        e.stopPropagation();
        tocContainer.classList.toggle('collapsed');
        var collapsed = tocContainer.classList.contains('collapsed');
        localStorage.setItem('toc-collapsed', collapsed);
        tocContainer.title = collapsed ? "Expand TOC" : "Collapse TOC";
      });

      tocContainer.addEventListener('click', function(e) {
        if (!tocContainer.classList.contains('collapsed')) return;
        e.stopPropagation();
        tocContainer.classList.toggle('collapsed');
        var collapsed = tocContainer.classList.contains('collapsed');
        localStorage.setItem('toc-collapsed', collapsed);
        tocContainer.title = collapsed ? "Expand TOC" : "Collapse TOC";
      });

      state.isAllExpanded = false;
      expandAllBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        state.isAllExpanded = !state.isAllExpanded;
        var items = tocList.querySelectorAll('.custom-toc-item');
        items.forEach(function(item) {
          if (item.querySelector('.toc-child-wrapper')) {
            if (state.isAllExpanded) item.classList.add('expanded');
            else item.classList.remove('expanded');
          }
        });

        if (state.isAllExpanded) {
          expandAllBtn.innerHTML = '<i class="fas fa-compress-arrows-alt"></i>';
          expandAllBtn.title = "Collapse All";
        } else {
          expandAllBtn.innerHTML = '<i class="fas fa-expand-arrows-alt"></i>';
          expandAllBtn.title = "Expand All";
        }
      });

      if (!state.scrollBound) {
        state.scrollBound = true;
        window.addEventListener('scroll', function() {
          if (state.scrollSpy) state.scrollSpy();
        });
      }

      if (!state.authEventBound) {
        state.authEventBound = true;
        window.addEventListener('auth:decrypted', function() {
          buildTOC();
        });
      }
    }

    buildTOC();
  })();

  // Click Effect Logic
  (function() {
    var shapes = ['circle', 'square', 'triangle', 'star'];
    var colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082', '#9400D3']; // Rainbow colors for better visibility

    document.addEventListener('click', function(e) {
      var shape = shapes[Math.floor(Math.random() * shapes.length)];
      var color = colors[Math.floor(Math.random() * colors.length)];
      var size = Math.floor(Math.random() * 20) + 20; // 20-40px

      var el = document.createElement('div');
      el.className = 'click-effect';
      el.style.left = e.clientX + 'px';
      el.style.top = e.clientY + 'px';
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      
      // Create SVG for hollow shapes
      var ns = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(ns, "svg");
      svg.setAttribute("width", "100%");
      svg.setAttribute("height", "100%");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.style.overflow = "visible";

      var shapeEl;

      if (shape === 'circle') {
        shapeEl = document.createElementNS(ns, "circle");
        shapeEl.setAttribute("cx", "50");
        shapeEl.setAttribute("cy", "50");
        shapeEl.setAttribute("r", "40");
      } else if (shape === 'square') {
        shapeEl = document.createElementNS(ns, "rect");
        shapeEl.setAttribute("x", "10");
        shapeEl.setAttribute("y", "10");
        shapeEl.setAttribute("width", "80");
        shapeEl.setAttribute("height", "80");
      } else if (shape === 'triangle') {
        shapeEl = document.createElementNS(ns, "polygon");
        shapeEl.setAttribute("points", "50,10 10,90 90,90");
      } else if (shape === 'star') {
        shapeEl = document.createElementNS(ns, "polygon");
        // Star points
        shapeEl.setAttribute("points", "50,5 61,35 98,35 68,57 79,91 50,70 21,91 32,57 2,35 39,35");
      }

      if (shapeEl) {
        shapeEl.setAttribute("fill", "none");
        shapeEl.setAttribute("stroke", color);
        shapeEl.setAttribute("stroke-width", "8");
        shapeEl.setAttribute("stroke-linejoin", "round");
        shapeEl.setAttribute("stroke-linecap", "round");
        svg.appendChild(shapeEl);
      }

      el.appendChild(svg);
      document.body.appendChild(el);

      // Cleanup
      setTimeout(function() {
        el.remove();
      }, 800);
    });
  })();
</script>

<script>
  (function() {
    var cfg = window.__SITE_AUTH || {};
    if (!cfg.enable) return;

    var storageKey = cfg.storage_key || 'hexo_auth_session';
    var loginPath = cfg.login_path || '/login/';
    var users = Array.isArray(cfg.users) ? cfg.users : [];

    function base64ToBytes(b64) {
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function bytesToBase64(bytes) {
      var binary = '';
      for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function base64UrlToString(input) {
      var b64 = input.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return atob(b64);
    }

    function concatBytes(a, b) {
      var out = new Uint8Array(a.length + b.length);
      out.set(a, 0);
      out.set(b, a.length);
      return out;
    }

    async function sha256(bytes) {
      var digest = await crypto.subtle.digest('SHA-256', bytes);
      return new Uint8Array(digest);
    }

    async function deriveKeyBytes(password, saltB64, iterations) {
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
      var salt = base64ToBytes(saltB64);
      var bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
        baseKey,
        256
      );
      return new Uint8Array(bits);
    }

    async function decryptAesGcm(keyBytes, ivB64, ctB64, tagB64) {
      var key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
      var iv = base64ToBytes(ivB64);
      var ct = base64ToBytes(ctB64);
      var tag = base64ToBytes(tagB64);
      var combined = concatBytes(ct, tag);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
      return new Uint8Array(plain);
    }

    function getRedirectUrl() {
      try {
        var p = new URLSearchParams(location.search);
        return p.get('redirect') || '';
      } catch (e) {
        return '';
      }
    }

    function buildLoginUrl(redirectTo) {
      var url = loginPath;
      var joiner = url.indexOf('?') >= 0 ? '&' : '?';
      return url + joiner + 'redirect=' + encodeURIComponent(redirectTo || (location.pathname + location.search + location.hash));
    }

    function loadSession() {
      try {
        var raw = sessionStorage.getItem(storageKey);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        if (!parsed || !parsed.accessKey || !parsed.username) return null;
        return parsed;
      } catch (e) {
        return null;
      }
    }

    function saveSession(username, accessKeyBytes) {
      var value = {
        username: username,
        accessKey: bytesToBase64(accessKeyBytes),
        t: Date.now()
      };
      sessionStorage.setItem(storageKey, JSON.stringify(value));
    }

    function clearSession() {
      sessionStorage.removeItem(storageKey);
    }

    function findUser(username) {
      for (var i = 0; i < users.length; i++) {
        if (users[i] && users[i].username === username) return users[i];
      }
      return null;
    }

    async function login(username, password) {
      var u = findUser(username);
      if (!u) throw new Error('用户名或密码错误');

      var iterations = Number(u.iterations || 150000);
      var keyBytes = await deriveKeyBytes(password, u.salt, iterations);
      var verifier = await sha256(keyBytes);
      if (bytesToBase64(verifier) !== u.verifier) throw new Error('用户名或密码错误');

      if (!u.wrapped_key || !u.wrapped_key.iv || !u.wrapped_key.ciphertext || !u.wrapped_key.tag) {
        throw new Error('账号配置不完整');
      }
      var accessKeyBytes = await decryptAesGcm(keyBytes, u.wrapped_key.iv, u.wrapped_key.ciphertext, u.wrapped_key.tag);
      saveSession(username, accessKeyBytes);
      return accessKeyBytes;
    }

    async function decryptProtectedBlocks(accessKeyBytes) {
      var nodes = document.querySelectorAll('.protected-block[data-protected]');
      if (!nodes.length) return;

      var key = await crypto.subtle.importKey('raw', accessKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        try {
          var encoded = el.getAttribute('data-protected');
          var jsonText = base64UrlToString(encoded);
          var payload = JSON.parse(jsonText);
          var iv = base64ToBytes(payload.iv);
          var ct = base64ToBytes(payload.ct);
          var tag = base64ToBytes(payload.tag);
          var combined = concatBytes(ct, tag);
          var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
          el.innerHTML = new TextDecoder().decode(plain);
        } catch (e) {
          el.innerHTML = '<div class=\"protected-placeholder\">受限内容解密失败</div>';
        }
      }
    }

    async function decryptProtectedTitles(accessKeyBytes) {
      var nodes = document.querySelectorAll('[data-protected-title]');
      if (!nodes.length) return;

      var key = await crypto.subtle.importKey('raw', accessKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        try {
          var encoded = el.getAttribute('data-protected-title') || '';
          if (!encoded) continue;
          var jsonText = base64UrlToString(encoded);
          var payload = JSON.parse(jsonText);
          var iv = base64ToBytes(payload.iv);
          var ct = base64ToBytes(payload.ct);
          var tag = base64ToBytes(payload.tag);
          var combined = concatBytes(ct, tag);
          var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
          var text = new TextDecoder().decode(plain);
          el.textContent = text;

          if (el.getAttribute('data-protected-title-main') === '1') {
            try {
              var siteTitleMeta = document.querySelector('meta[itemprop=\"name\"]');
              var siteTitle = siteTitleMeta ? siteTitleMeta.getAttribute('content') : '';
              document.title = siteTitle ? (text + ' | ' + siteTitle) : text;
            } catch (e) {}
          }
        } catch (e) {}
      }
    }

    function renderPlaceholders() {
      var nodes = document.querySelectorAll('.protected-block[data-protected]');
      if (!nodes.length) return;
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        var url = buildLoginUrl();
        el.innerHTML = '<div class=\"protected-placeholder\">此内容仅对登录用户可见。<a href=\"' + url + '\">去登录</a></div>';
      }
    }

    function bindLoginForm() {
      var form = document.getElementById('auth-login-form');
      if (!form) return;
      var msg = document.getElementById('auth-message');
      var logoutBtn = document.getElementById('auth-logout-btn');

      function setMessage(text) {
        if (!msg) return;
        msg.textContent = text || '';
      }

      var existing = loadSession();
      if (existing) {
        setMessage('已登录：' + existing.username);
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var username = (document.getElementById('auth-username') || {}).value || '';
        var password = (document.getElementById('auth-password') || {}).value || '';
        setMessage('登录中...');
        login(username.trim(), password)
          .then(function(accessKeyBytes) {
            setMessage('登录成功：' + username.trim());
            return Promise.resolve()
              .then(function() { return decryptProtectedBlocks(accessKeyBytes); })
              .then(function() { return decryptProtectedTitles(accessKeyBytes); });
          })
          .then(function() {
            try { window.dispatchEvent(new Event('auth:decrypted')); } catch (e) {}
            var redirectTo = getRedirectUrl();
            location.href = redirectTo || '/';
          })
          .catch(function(err) {
            setMessage(err && err.message ? err.message : '登录失败');
          });
      });

      if (logoutBtn) {
        logoutBtn.addEventListener('click', function() {
          clearSession();
          setMessage('已退出登录');
        });
      }
    }

    window.SiteAuth = {
      isLoggedIn: function() {
        return !!loadSession();
      },
      logout: function() {
        clearSession();
      }
    };

    (function init() {
      bindLoginForm();
      var session = loadSession();
      if (!session) {
        renderPlaceholders();
        return;
      }
      try {
        var accessKeyBytes = base64ToBytes(session.accessKey);
        Promise.resolve()
          .then(function() { return decryptProtectedBlocks(accessKeyBytes); })
          .then(function() { return decryptProtectedTitles(accessKeyBytes); })
          .then(function() { try { window.dispatchEvent(new Event('auth:decrypted')); } catch (e) {} });
      } catch (e) {
        clearSession();
        renderPlaceholders();
      }
    })();
  })();
</script>
