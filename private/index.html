    (function() {
      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark-mode');
      } else {
        document.documentElement.classList.remove('dark-mode');

    body {
      background-color: var(--body-bg-color);
      background-image: url("/images/private-bg.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

    body::before {
      content: "";

      inset: 0;
      pointer-events: none;
      background: rgba(0,0,0,0.15);

    .pm-wrap {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 24px auto;

    }
    .pm-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 14px; }
    .pm-title { font-size: 18px; font-weight: 600; margin:0; }
    .pm-actions { display:flex; gap:10px; align-items:center; }
    .pm-btn { padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.18); background: var(--body-bg-color); color: var(--text-color); cursor:pointer; }
    .pm-shell { display:flex; gap: 14px; }
    .pm-side { width: 320px; flex: 0 0 320px; border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; background: var(--card-bg-color); overflow:hidden; }
    .pm-main { flex:1; min-width:0; border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; background: var(--card-bg-color); padding: 14px 16px; }
    .pm-main img { max-width: 100%; height: auto; }
    .pm-main video { max-width: 100%; }
    .pm-hint { padding: 12px 14px; border-radius: 10px; border: 1px dashed rgba(0,0,0,0.25); background: rgba(0,0,0,0.02); }
    .pm-tree { list-style:none; margin:0; padding: 10px; max-height: 72vh; overflow:auto; }
    .pm-node { margin: 2px 0; }
    .pm-file { display:flex; gap:10px; width:100%; border:0; background: transparent; color: var(--text-color); padding: 10px 10px; border-radius: 8px; cursor:pointer; text-align:left; }
    .pm-file:hover { background: rgba(0,0,0,0.05); }
    .dark-mode .pm-file:hover { background: rgba(255,255,255,0.08); }
    .pm-file.active { background: rgba(0,0,0,0.06); color: var(--link-hover-color); }
    .dark-mode .pm-file.active { background: rgba(255,255,255,0.10); }
    .pm-cover {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      flex: 0 0 56px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(0,0,0,0.03);
    }
    .dark-mode .pm-cover {
      border-color: rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
    }
    .pm-cover-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      opacity: 0.75;
    }
    .pm-file-meta { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .pm-file-title { font-size: 20px; font-weight: 800; line-height: 1.2; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pm-file-date { font-size: 12px; opacity: 0.75; line-height: 1.2; }
    .pm-breadcrumb { font-size: 36px; font-weight: 900; opacity: 1; margin: 0 0 14px 0; line-height: 1.12; }
    .pm-preview-cover {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(0,0,0,0.03);
    }
    .dark-mode .pm-preview-cover {
      border-color: rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
    }
    .pm-preview-actions { margin-top: 12px; }
    @media (max-width: 980px) {
      .pm-shell { flex-direction: column; }
      .pm-side { width:100%; flex: 0 0 auto; }
      .pm-tree { max-height: 40vh; }

<body>
  <div class="pm-wrap">
    <div class="pm-top">
      <h1 class="pm-title">private</h1>
      <div class="pm-actions">
        <button class="pm-btn" id="pm-logout-btn" type="button">退出登录</button>
      </div>
    </div>
    <div class="pm-shell">
      <div class="pm-side">
        <ul class="pm-tree" id="pm-tree"></ul>
      </div>
      <div class="pm-main">
        <div class="pm-breadcrumb" id="pm-breadcrumb"></div>
        <div id="pm-view"></div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      var cfg = window.__PRIVATE_MODULE || {};
      var storageKey = cfg.storageKey || 'hexo_auth_session';
      var loginPath = cfg.loginPath || '/login/';
      var manifestEncoded = cfg.manifest || '';
      var treeEl = document.getElementById('pm-tree');
      var viewEl = document.getElementById('pm-view');
      var bcEl = document.getElementById('pm-breadcrumb');
      var logoutBtn = document.getElementById('pm-logout-btn');

      function buildLoginUrl() {
        var target = location.pathname + location.search + location.hash;
        var joiner = loginPath.indexOf('?') >= 0 ? '&' : '?';
        return loginPath + joiner + 'redirect=' + encodeURIComponent(target);
      }

      function base64ToBytes(b64) {
        var binary = atob(b64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function base64UrlToString(input) {
        var b64 = String(input || '').replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        return atob(b64);
      }

      function concatBytes(a, b) {
        var out = new Uint8Array(a.length + b.length);
        out.set(a, 0);
        out.set(b, a.length);
        return out;
      }

      function loadSession() {
        try {
          var raw = sessionStorage.getItem(storageKey);
          if (!raw) return null;
          var parsed = JSON.parse(raw);
          if (!parsed || !parsed.accessKey) return null;
          return parsed;
        } catch (e) {
          return null;
        }
      }

      function clearSession() {
        sessionStorage.removeItem(storageKey);
      }

      async function decryptPayloadToString(encoded, accessKeyBytes) {
        var key = await crypto.subtle.importKey('raw', accessKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
        var jsonText = base64UrlToString(encoded);
        var payload = JSON.parse(jsonText);
        var iv = base64ToBytes(payload.iv);
        var ct = base64ToBytes(payload.ct);
        var tag = base64ToBytes(payload.tag);
        var combined = concatBytes(ct, tag);
        var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, combined);
        return new TextDecoder().decode(plain);
      }

      function showUnauthed() {
        viewEl.innerHTML = '<div class="pm-hint">private 仅对登录用户可见。<a href="' + buildLoginUrl() + '">去登录</a></div>';
        treeEl.innerHTML = '';
        bcEl.textContent = '';
      }

      function formatDate(iso) {
        try {
          if (!iso) return '';
          var d = new Date(iso);
          if (isNaN(d.getTime())) return String(iso);
          var y = String(d.getFullYear());
          var m = String(d.getMonth() + 1).padStart(2, '0');
          var day = String(d.getDate()).padStart(2, '0');
          var hh = String(d.getHours()).padStart(2, '0');
          var mm = String(d.getMinutes()).padStart(2, '0');
          return y + '-' + m + '-' + day + ' ' + hh + ':' + mm;
        } catch (e) {
          return String(iso || '');
        }
      }

      function escapeHtml(input) {
        return String(input || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttr(input) {
        return escapeHtml(input);
      }

function setActive(fileId) {
  var btns = treeEl.querySelectorAll('button.pm-file');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  for (var j = 0; j < btns.length; j++) {
    if (btns[j].getAttribute('data-file-id') === String(fileId || '')) {
      btns[j].classList.add('active');
      break;
    }
  }
}

function renderList(files) {
  treeEl.innerHTML = '';
  (files || []).forEach(function (file) {
    var li = document.createElement('li');
    li.className = 'pm-node';

    var fbtn = document.createElement('button');
    fbtn.type = 'button';
    fbtn.className = 'pm-file';
    fbtn.setAttribute('data-file-id', String(file.id || ''));
    var cover = file && file.cover ? String(file.cover) : '';
    var coverHtml = cover
      ? '<img class="pm-cover" src="' + escapeAttr(cover) + '" alt="">'
      : '<span class="pm-cover pm-cover-empty"><i class="far fa-image"></i></span>';
    fbtn.innerHTML =
      coverHtml +
      '<span class="pm-file-meta">' +
      '<span class="pm-file-title">' + escapeHtml(file.title || '未命名') + '</span>' +
      '<span class="pm-file-date">' + escapeHtml(formatDate(file.date || '')) + '</span>' +
      '</span>';
    fbtn.addEventListener('click', function () { showPreview(file); });
    li.appendChild(fbtn);
    treeEl.appendChild(li);
  });
}

function showPreview(file) {
  if (!file) return;
  setActive(file.id);
  bcEl.textContent = file.title || '';
  var cover = file && file.cover ? String(file.cover) : '';
  var coverHtml = cover ? '<img class="pm-preview-cover" src="' + escapeAttr(cover) + '" alt="">' : '';
  viewEl.innerHTML =
    (coverHtml ? coverHtml : '<div class="pm-hint">无封面</div>') +
    '<div class="pm-preview-actions"><button class="pm-btn" id="pm-open-btn" type="button">打开全文</button></div>';
  location.hash = '#file=' + encodeURIComponent(file.id || '');

  var openBtn = document.getElementById('pm-open-btn');
  if (openBtn) openBtn.addEventListener('click', function () { openFull(file); });
}

function openFull(file) {
  if (!file) return;
  setActive(file.id);
  bcEl.textContent = file.title || '';
  viewEl.innerHTML = file.html || '';
  location.hash = '#file=' + encodeURIComponent(file.id || '') + '&open=1';
}

async function initAuthed(accessKeyBytes) {
  if (!manifestEncoded) {
    viewEl.innerHTML = '<div class="pm-hint">private 暂无内容</div>';
    treeEl.innerHTML = '';
    bcEl.textContent = '';
    return;
  }
  var manifestText = await decryptPayloadToString(manifestEncoded, accessKeyBytes);
  var manifest = JSON.parse(manifestText);
  var files = (manifest && Array.isArray(manifest.files)) ? manifest.files : [];
  if (!files.length) {
    viewEl.innerHTML = '<div class="pm-hint">private 暂无内容</div>';
    treeEl.innerHTML = '';
    bcEl.textContent = '';
    return;
  }

  renderList(files);

  function openFromHash() {
    var h = String(location.hash || '');
    if (!h || h === '#') return false;
    var qs = h.charAt(0) === '#' ? h.slice(1) : h;
    var params;
    try { params = new URLSearchParams(qs); } catch (e) { return false; }
    var id = params.get('file') || '';
    var open = params.get('open') === '1';
    if (!id) return false;
    var target = files.find(function (f) { return String(f.id || '') === String(id); });
    if (!target) return false;
    if (open) openFull(target);
    else showPreview(target);
    return true;
  }

  bcEl.textContent = '';
  viewEl.innerHTML = '<div class="pm-hint">选择一篇记录查看封面，点“打开全文”再展开内容</div>';
  openFromHash();

  window.addEventListener('hashchange', function () { openFromHash(); });
}

if (logoutBtn) {
  logoutBtn.addEventListener('click', function () {
    clearSession();
    showUnauthed();
  });
}

var session = loadSession();
if (!session) {
  showUnauthed();
  return;
}

try {
  var accessKeyBytes = base64ToBytes(session.accessKey);
  initAuthed(accessKeyBytes).catch(function () { showUnauthed(); });
} catch (e) {
  clearSession();
  showUnauthed();
}
    }) ();
  </script >
